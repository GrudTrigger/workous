name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:

jobs:
  lint_frontend:
    name: Проверка кода frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Забрать код
        uses: actions/checkout@v5

      - name: Установка зависимотей
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Выполнить команды
        run: |
          npm ci
          npm run lint

  type_frontend:
    name: Проверка типов frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Забрать код
        uses: actions/checkout@v5

      - name: Установка зависимотей
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Выполнить команды
        run: |
          npm ci
          npm run typecheck
  lint_backend:
    name: Проверка кода backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Забрать код
        uses: actions/checkout@v5

      - name: Поставить Python
        uses: actions/setup-python@v6
        with:                              
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Установка зависимотей
        run: pip install -r requirements-dev.txt

      - name: Выполнить команды
        run: |
          ruff check .
          ruff format --check .

  test_backend:
    name: Тесты backend
    runs-on: ubuntu-latest
    needs: [lint_backend]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Забрать код
        uses: actions/checkout@v5

      - name: Поставить Python
        uses: actions/setup-python@v6
        with:                              
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Установка зависимотей
        run: pip install -r requirements-dev.txt

      - name: Тесты с покрытием
        run: pytest --cov=app --cov-report=term --cov-report=html

      - name: Загрузить отчёт о покрытии
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/htmlcov/
          retention-days: 7
          
  test_frontend:
    name: Тесты frontend
    runs-on: ubuntu-latest
    needs: [lint_frontend, type_frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Забрать код
        uses: actions/checkout@v5

      - name: Установка зависимотей
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Тесты с покрытием
        run: |
          npm ci
          npx vitest run --coverage

      - name: Загрузить отчёт о покрытии
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/
          retention-days: 7
  build_frontend:
    name: Сборка frontend
    runs-on: ubuntu-latest
    needs: [test_frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Забрать код
        uses: actions/checkout@v5

      - name: Установка зависимостей
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Сборка frontend
        run: |
          npm ci
          npm run build
  docker:
    name: Docker ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [build_frontend, test_backend]
    permissions:
      contents: read  # чтобы checkout работал
      packages: write # чтобы пушить в ghcr.io
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v5 

      - name: Логин владельца в нижнем регистре
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3 #включает BuildKit (нужен для кэша)

      - name: Логин в GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Теги образа
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/workout-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}






          