name: CI

on:
  push:
    branches:
      - main

jobs:
  lint_frontend:
    name: Проверка кода frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Забрать код
        uses: actions/checkout@v5

      - name: Установка зависимотей
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Выполнить команды
        run: |
          npm ci
          npm run lint

  type_frontend:
    name: Проверка типов frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Забрать код
        uses: actions/checkout@v5

      - name: Установка зависимотей
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Выполнить команды
        run: |
          npm ci
          npm run typecheck
  lint_backend:
    name: Проверка кода backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Забрать код
        uses: actions/checkout@v5

      - name: Поставить Python
        uses: actions/setup-python@v6
        with:                              
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Установка зависимотей
        run: pip install -r requirements-dev.txt

      - name: Выполнить команды
        run: |
          ruff check .
          ruff format --check .

  test_backend:
    name: Тесты backend
    runs-on: ubuntu-latest
    needs: [lint_backend]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Забрать код
        uses: actions/checkout@v5

      - name: Поставить Python
        uses: actions/setup-python@v6
        with:                              
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Установка зависимотей
        run: pip install -r requirements-dev.txt

      - name: Выполнить команды
        run: |
          pytest
          
  test_frontend:
    name: Тесты frontend
    runs-on: ubuntu-latest
    needs: [lint_frontend, type_frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Забрать код
        uses: actions/checkout@v5

      - name: Забрать код
        uses: actions/checkout@v5

      - name: Установка зависимотей
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Выполнить команды
        run: |
          npm i vitest
          npm run test



          